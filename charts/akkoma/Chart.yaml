apiVersion: v2
name: akkoma
description: A Helm chart for deploying Akkoma, a federated social networking server (ActivityPub/Fediverse)
type: application
# Not the release version and not bumped per change: release.yml stamps the
# version chosen at release time, and main builds publish 0.0.0-main.* charts.
version: 0.6.2
appVersion: "v3.20.0"
keywords:
  - akkoma
  - pleroma
  - fediverse
  - activitypub
  - social-network
  - federation
home: https://github.com/adamancini/akkoma-helm
sources:
  - https://akkoma.dev/AkkomaGang/akkoma
  - https://docs.akkoma.dev/
  - https://github.com/adamancini/akkoma-helm
maintainers:
  - name: adamancini
    url: https://github.com/adamancini
dependencies:
  - name: garage
    version: "0.1.0"
    condition: garage.enabled
