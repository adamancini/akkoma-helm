# Default values for akkoma.
# This is a YAML-formatted file following progressive disclosure pattern.
# Basic configuration comes first, advanced options are clearly separated.

#
# BASIC CONFIGURATION
# These are the only required values to get started
#

# Instance configuration
akkoma:
  # REQUIRED: Your instance domain (must match Ingress)
  domain: "akkoma.example.com"

  # REQUIRED: Admin email for notifications
  adminEmail: "admin@example.com"

  # Instance name (defaults to domain if not set)
  instanceName: ""

# Image configuration
image:
  repository: ghcr.io/adamancini/akkoma
  tag: ""  # Defaults to Chart.appVersion (v3.17.0)
  pullPolicy: IfNotPresent

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: false
    secretName: "akkoma-tls"

#
# ADVANCED CONFIGURATION
# Optional overrides for specific needs
#

# External secrets (production recommendation)
# When enabled, the chart will use an existing Secret instead of generating one
# This is recommended for production to integrate with secret management solutions
# like Sealed Secrets, External Secrets Operator, or Vault
externalSecret:
  enabled: false
  # Name of the existing Secret to use
  name: ""
  # Secret key names (customize if your Secret uses different keys)
  keys:
    secretKeyBase: "secret-key-base"
    signingSalt: "signing-salt"
    releaseCookie: "release-cookie"

# Akkoma application secrets (when externalSecret.enabled is false).
# Precedence per value: explicit value below > existing in-cluster value > random.
#
# IMPORTANT for GitOps (ArgoCD/Flux) and any `helm template` workflow:
# Helm's `lookup` only reads the cluster during `helm install`/`helm upgrade`.
# Under `helm template` it returns nothing, so the chart would regenerate random
# values on every render and invalidate user sessions. To get stable values, set
# these explicitly (manage them with SOPS/Sealed Secrets) or use externalSecret.
secrets:
  secretKeyBase: ""   # 64-char string for Phoenix sessions
  signingSalt: ""     # 8-char salt for signed tokens
  releaseCookie: ""   # 64-char string for Erlang distribution

# Secret generation behavior (when externalSecret.enabled is false):
# - On first install: Chart generates random secrets automatically
# - On upgrades: Existing secrets are preserved using Helm lookup function
# - If secret is deleted between upgrades, new secrets will be generated
# WARNING: Deleting and regenerating secrets will invalidate user sessions

# PostgreSQL configuration
postgresql:
  # Storage settings
  storageSize: 10Gi
  storageClass: ""  # Use cluster default
  persistence:
    # false: use an emptyDir instead of a PVC for the bundled StatefulSet's
    # data volume. Only applies to the bundled StatefulSet path (ignored
    # when postgresql.external.enabled or postgresql.cnpg.enabled is true).
    # For clusters with no CSI driver / default StorageClass, where a PVC
    # would otherwise stay Pending forever. Data is lost on every pod
    # restart or reschedule -- fine for a demo/ephemeral instance, not for
    # anything you want to keep.
    enabled: true

  # Database connection details
  database: "akkoma"
  username: "akkoma"

  # Bundled PostgreSQL password (used when external and cnpg are both disabled).
  # Precedence: password > existing in-cluster value > random.
  # Set password (or existingSecret) for GitOps/ArgoCD; otherwise the random
  # fallback is regenerated on every `helm template` render. Manage with
  # SOPS/Sealed Secrets when set inline.
  password: ""
  # Reference an existing Secret for the bundled PostgreSQL password instead of
  # generating one. When set, the chart renders no PostgreSQL Secret.
  existingSecret: ""
  existingSecretPasswordKey: "postgres-password"

  # Resource limits for PostgreSQL
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Security context for the bundled PostgreSQL StatefulSet.
  # Defaults to UID/GID 10001 rather than the official image's built-in
  # "postgres" user (999) -- outside the 0-10000 range some hardening
  # scanners flag as reserved/host-collision-prone. postgres:15-alpine
  # initializes PGDATA fresh under whatever UID/GID it's run as, so this is
  # safe for new installs. If upgrading an EXISTING installation with data
  # already on disk owned by UID 999, override this back to 999 (or migrate
  # ownership of the PVC's data) before upgrading, since a fresh UID can't
  # read files an old UID owns under default 0700 permissions.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  # External PostgreSQL (disabled by default, uses bundled StatefulSet)
  external:
    enabled: false
    host: ""
    port: 5432
    database: "akkoma"
    username: "akkoma"
    passwordSecret: ""
    passwordKey: "password"

  # CloudNativePG operator-managed PostgreSQL
  # Requires the CloudNativePG operator to be installed in the cluster
  # When enabled, disables the bundled PostgreSQL StatefulSet
  cnpg:
    enabled: false
    instances: 1
    storage:
      size: 10Gi
      storageClass: ""
    imageName: "ghcr.io/cloudnative-pg/postgresql:16"
    parameters: {}
    backup:
      enabled: false
      barmanObjectStore: {}
      volumeSnapshot:
        enabled: false
        className: ""

# Storage configuration
storage:
  # Upload storage backend: "local" (PVC) or "s3" (S3-compatible)
  type: local
  uploads:
    size: 50Gi
    storageClass: ""
    persistence:
      # false: use an emptyDir instead of a PVC. Contents (uploaded media)
      # are lost on every pod restart or reschedule -- see
      # postgresql.persistence.enabled for when this is appropriate.
      enabled: true
  frontends:
    size: 5Gi
    storageClass: ""
    persistence:
      # false: use an emptyDir instead of a PVC. install-frontends re-runs
      # on every pod (re)start regardless, so losing this volume only costs
      # a re-download, not data -- safe to disable even outside the
      # no-StorageClass case if you'd rather not provision it at all.
      enabled: true
  # S3-compatible storage (used when storage.type is "s3")
  s3:
    # S3 endpoint (e.g. s3.amazonaws.com, s3.us-west-2.amazonaws.com, s3.garage.localhost)
    endpoint: ""
    region: "us-east-1"
    bucket: "akkoma-uploads"
    # Public URL for media (e.g. https://media.example.com or https://bucket.s3.amazonaws.com)
    # If empty, defaults to https://<domain>/media/
    baseUrl: ""
    # Use an existing Secret for S3 credentials instead of creating one
    existingSecret: ""
    # S3 credentials (ignored if existingSecret is set)
    accessKeyId: ""
    secretAccessKey: ""

# Instance behavior
instance:
  # Character limit for posts
  characterLimit: 5000

  # Allow new user registrations
  registrationsOpen: false

  # Upload size limit (bytes)
  uploadLimit: 16000000

  # Instance description
  description: ""

# Frontend version overrides
# Control which version of each frontend is installed
# ref: version/branch to install (e.g. "stable", "develop", or a commit hash)
# url: optional full URL to a custom build zip (overrides the default CDN URL)
frontends:
  pleromaFe:
    ref: "stable"
    url: ""  # Custom build URL override (e.g. https://my-cdn.example.com/akkoma-fe.zip)
  adminFe:
    ref: "stable"
    url: ""  # Custom build URL override (e.g. https://my-cdn.example.com/admin-fe.zip)

# Garage S3-compatible object storage (optional)
# When enabled, deploys Garage alongside Akkoma for self-hosted media storage
# Automatically configures Akkoma to use Garage as its S3 backend
garage:
  enabled: false
  # Override Garage subchart values
  persistence:
    meta:
      size: 1Gi
    data:
      size: 50Gi

# Prometheus metrics
# Akkoma has built-in metrics at /api/v1/akkoma/metrics
# Requires export_prometheus_metrics: true in Akkoma config
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    # Scrape interval
    interval: 30s
    # Additional labels for the ServiceMonitor (e.g. release: prometheus)
    labels: {}
  # Grafana dashboard ConfigMap (requires Grafana sidecar for auto-discovery)
  grafana:
    enabled: false
    # Labels applied to the ConfigMap for Grafana sidecar discovery
    labels:
      grafana_dashboard: "1"
    # Optional annotations for the ConfigMap
    annotations: {}

# Media pruning CronJob
# Runs pleroma_ctl database prune_objects to clean up remote media
mediaPruning:
  enabled: false
  schedule: "0 3 * * 0"  # 3 AM every Sunday
  options:
    keepFollowed: "posts"  # none, posts, full
    keepThreads: true
    keepNonPublic: true
    limit: 0
    pruneOrphanedActivities: true
    vacuum: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# Network security
# When enabled, restricts traffic to only necessary connections:
# - Akkoma: ingress from ingress controller, egress to PostgreSQL/DNS/HTTPS (federation)
# - PostgreSQL: ingress from Akkoma pods only, egress for DNS
networkPolicy:
  enabled: false
  # Labels to identify the ingress controller namespace
  # Adjust based on your ingress controller installation
  ingressControllerLabels:
    kubernetes.io/metadata.name: ingress-nginx

# Hardening options
# Implements recommendations from https://docs.akkoma.dev/stable/configuration/hardening/
# Note: Systemd-level hardening (PrivateTmp, ProtectHome, NoNewPrivileges, etc.)
# is already handled by the pod/container securityContext above.
# Note: HTTP binding to localhost (ip: {127,0,0,1}) is not applicable in Kubernetes;
# pods must listen on 0.0.0.0 for Service routing. Use networkPolicy for equivalent isolation.
hardening:
  # Secure cookie flag - sets __Host- prefix, enforces HTTPS-only cookies
  secureCookieFlag: true

  # Separate domain for serving user uploads (content isolation)
  # When set, uploads are served from this URL instead of https://<domain>/media/
  # Recommended to prevent privilege boundary exploits from malicious uploads
  # Example: "https://media.myinstance.net"
  mediaBaseUrl: ""

  # HTTP security headers
  httpSecurity:
    # Enable security headers (XSS protection, frame denial, CSP, MIME sniffing prevention)
    enabled: true
    # Strict-Transport-Security header (HTTPS-only access)
    sts: true
    # Referrer-Policy header: "same-origin" or "no-referrer"
    referrerPolicy: "same-origin"

# Resource limits - NO CPU LIMITS (allow BEAM bursting)
resources:
  requests:
    cpu: 500m      # Guaranteed CPU for scheduling
    memory: 1Gi    # Guaranteed memory
  limits:
    # No CPU limit - allow bursting for BEAM scheduler efficiency
    memory: 2Gi    # OOM protection only

# Resource limits for the deployment's init containers.
# waitForDb and installFrontends are genuinely lightweight (a shell loop /
# a wget+unzip); dbMigrate is NOT -- it boots the exact same BEAM/OTP
# release as the main akkoma container just to run `pleroma_ctl migrate`,
# so it needs comparable memory to the main container's own `resources`
# above, not a "setup script" allocation, or a real migration run risks
# OOMKill on release boot alone before it does any migration work.
initContainerResources:
  waitForDb:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
  dbMigrate:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # Unlike the main container, a CPU limit is fine here -- this is a
      # one-shot batch job (migrate then exit), not a live-traffic BEAM
      # scheduler under latency pressure, so throttling doesn't hurt
      # correctness the way it would for the main container.
      cpu: "1"
      memory: 2Gi
  installFrontends:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Security context (hardened from the start)
# UID/GID 10001 matches the akkoma user created in the Dockerfile -- outside
# the 0-10000 range some hardening scanners flag as reserved/host-collision-prone.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault  # Baseline security

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Name overrides
nameOverride: ""
fullnameOverride: ""
