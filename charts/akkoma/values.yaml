# Default values for akkoma.
# This is a YAML-formatted file following progressive disclosure pattern.
# Basic configuration comes first, advanced options are clearly separated.

#
# BASIC CONFIGURATION
# These are the only required values to get started
#

# Instance configuration
akkoma:
  # REQUIRED: Your instance domain (must match Ingress)
  domain: "akkoma.example.com"

  # REQUIRED: Admin email for notifications
  adminEmail: "admin@example.com"

  # Instance name (defaults to domain if not set)
  instanceName: ""

# Image configuration
image:
  repository: ghcr.io/adamancini/akkoma
  tag: ""  # Defaults to Chart.appVersion (v3.17.0)
  pullPolicy: IfNotPresent

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: false
    secretName: "akkoma-tls"

#
# ADVANCED CONFIGURATION
# Optional overrides for specific needs
#

# External secrets (production recommendation)
# When enabled, the chart will use an existing Secret instead of generating one
# This is recommended for production to integrate with secret management solutions
# like Sealed Secrets, External Secrets Operator, or Vault
externalSecret:
  enabled: false
  # Name of the existing Secret to use
  name: ""
  # Secret key names (customize if your Secret uses different keys)
  keys:
    secretKeyBase: "secret-key-base"
    signingSalt: "signing-salt"
    releaseCookie: "release-cookie"

# Secret generation behavior (when externalSecret.enabled is false):
# - On first install: Chart generates random secrets automatically
# - On upgrades: Existing secrets are preserved using Helm lookup function
# - If secret is deleted between upgrades, new secrets will be generated
# WARNING: Deleting and regenerating secrets will invalidate user sessions

# PostgreSQL configuration
postgresql:
  # Storage settings
  storageSize: 10Gi
  storageClass: ""  # Use cluster default

  # Database connection details
  database: "akkoma"
  username: "akkoma"

  # Resource limits for PostgreSQL
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

  # External PostgreSQL (disabled by default, uses bundled StatefulSet)
  external:
    enabled: false
    host: ""
    port: 5432
    database: "akkoma"
    username: "akkoma"
    passwordSecret: ""
    passwordKey: "password"

# Storage configuration
storage:
  # Upload storage backend: "local" (PVC) or "s3" (S3-compatible)
  type: local
  uploads:
    size: 50Gi
    storageClass: ""
  frontends:
    size: 5Gi
    storageClass: ""
  # S3-compatible storage (used when storage.type is "s3")
  s3:
    # S3 endpoint (e.g. s3.amazonaws.com, s3.us-west-2.amazonaws.com, s3.garage.localhost)
    endpoint: ""
    region: "us-east-1"
    bucket: "akkoma-uploads"
    # Public URL for media (e.g. https://media.example.com or https://bucket.s3.amazonaws.com)
    # If empty, defaults to https://<domain>/media/
    baseUrl: ""
    # Use an existing Secret for S3 credentials instead of creating one
    existingSecret: ""
    # S3 credentials (ignored if existingSecret is set)
    accessKeyId: ""
    secretAccessKey: ""

# Instance behavior
instance:
  # Character limit for posts
  characterLimit: 5000

  # Allow new user registrations
  registrationsOpen: false

  # Upload size limit (bytes)
  uploadLimit: 16000000

  # Instance description
  description: ""

# Garage S3-compatible object storage (optional)
# When enabled, deploys Garage alongside Akkoma for self-hosted media storage
# Automatically configures Akkoma to use Garage as its S3 backend
garage:
  enabled: false
  # Override Garage subchart values
  persistence:
    meta:
      size: 1Gi
    data:
      size: 50Gi

# Prometheus metrics
# Akkoma has built-in metrics at /api/v1/akkoma/metrics
# Requires export_prometheus_metrics: true in Akkoma config
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    # Scrape interval
    interval: 30s
    # Additional labels for the ServiceMonitor (e.g. release: prometheus)
    labels: {}
  # Grafana dashboard ConfigMap (requires Grafana sidecar for auto-discovery)
  grafana:
    enabled: false
    # Labels applied to the ConfigMap for Grafana sidecar discovery
    labels:
      grafana_dashboard: "1"
    # Optional annotations for the ConfigMap
    annotations: {}

# Network security
# When enabled, restricts traffic to only necessary connections:
# - Akkoma: ingress from ingress controller, egress to PostgreSQL/DNS/HTTPS (federation)
# - PostgreSQL: ingress from Akkoma pods only, egress for DNS
networkPolicy:
  enabled: false
  # Labels to identify the ingress controller namespace
  # Adjust based on your ingress controller installation
  ingressControllerLabels:
    kubernetes.io/metadata.name: ingress-nginx

# Resource limits - NO CPU LIMITS (allow BEAM bursting)
resources:
  requests:
    cpu: 500m      # Guaranteed CPU for scheduling
    memory: 1Gi    # Guaranteed memory
  limits:
    # No CPU limit - allow bursting for BEAM scheduler efficiency
    memory: 2Gi    # OOM protection only

# Security context (hardened from the start)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault  # Baseline security

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Name overrides
nameOverride: ""
fullnameOverride: ""
