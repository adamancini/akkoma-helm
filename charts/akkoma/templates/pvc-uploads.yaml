{{- if .Values.storage.uploads.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "akkoma.fullname" . }}-uploads
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
  - ReadWriteOnce
  {{- if .Values.storage.uploads.storageClass }}
  storageClassName: {{ .Values.storage.uploads.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.uploads.size }}
{{- end }}
