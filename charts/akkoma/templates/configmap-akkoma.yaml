apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "akkoma.fullname" . }}-config
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
data:
  prod.secret.exs: |
    import Config

    # Web endpoint configuration
    config :pleroma, Pleroma.Web.Endpoint,
      url: [host: "{{ .Values.akkoma.domain }}", scheme: "https", port: 443],
      http: [ip: {0, 0, 0, 0}, port: 4000],
      secret_key_base: System.get_env("SECRET_KEY_BASE"),
      signing_salt: System.get_env("SIGNING_SALT")

    # Instance configuration
    config :pleroma, :instance,
      name: "{{ .Values.akkoma.instanceName | default .Values.akkoma.domain }}",
      email: "{{ .Values.akkoma.adminEmail }}",
      notify_email: "{{ .Values.akkoma.adminEmail }}",
      limit: {{ .Values.instance.characterLimit }},
      registrations_open: {{ .Values.instance.registrationsOpen }},
      upload_limit: {{ .Values.instance.uploadLimit }},
      static_dir: "/opt/akkoma/instance/static"
      {{- if .Values.instance.description }},
      description: "{{ .Values.instance.description }}"
      {{- end }}

    # Database configuration
    config :pleroma, Pleroma.Repo,
      adapter: Ecto.Adapters.Postgres,
      username: System.get_env("DB_USER"),
      password: System.get_env("DB_PASSWORD"),
      database: System.get_env("DB_NAME"),
      hostname: System.get_env("DB_HOST"),
      pool_size: 10

    # Allow admin-fe to manage configuration from the database
    config :pleroma, configurable_from_database: true

    # Frontend configuration
    config :pleroma, :frontends,
      primary: %{"name" => "pleroma-fe", "ref" => "stable"},
      admin: %{"name" => "admin-fe", "ref" => "stable"}

    # Upload configuration
    {{- if .Values.garage.enabled }}
    config :pleroma, Pleroma.Upload,
      uploader: Pleroma.Uploaders.S3,
      base_url: "https://{{ .Values.akkoma.domain }}/media/"

    config :ex_aws, :s3,
      access_key_id: System.get_env("S3_ACCESS_KEY_ID"),
      secret_access_key: System.get_env("S3_SECRET_ACCESS_KEY"),
      host: "{{ .Release.Name }}-garage",
      port: 3900,
      scheme: "http://",
      region: "garage"

    config :pleroma, Pleroma.Uploaders.S3,
      bucket: "akkoma-uploads"
    {{- else if eq .Values.storage.type "s3" }}
    config :pleroma, Pleroma.Upload,
      uploader: Pleroma.Uploaders.S3,
      base_url: "{{ .Values.storage.s3.baseUrl | default (printf "https://%s/media/" .Values.akkoma.domain) }}"

    config :ex_aws, :s3,
      access_key_id: System.get_env("S3_ACCESS_KEY_ID"),
      secret_access_key: System.get_env("S3_SECRET_ACCESS_KEY"),
      host: "{{ .Values.storage.s3.endpoint }}",
      region: "{{ .Values.storage.s3.region }}"

    config :pleroma, Pleroma.Uploaders.S3,
      bucket: "{{ .Values.storage.s3.bucket }}"
    {{- else }}
    config :pleroma, Pleroma.Upload,
      uploader: Pleroma.Uploaders.Local,
      base_url: "https://{{ .Values.akkoma.domain }}/media/",
      base_path: "/opt/akkoma/uploads"
    {{- end }}

    # Media proxy configuration
    config :pleroma, :media_proxy,
      enabled: true,
      proxy_opts: [
        redirect_on_failure: true,
        max_body_length: {{ .Values.instance.uploadLimit }}
      ]

    {{- if .Values.metrics.enabled }}
    # Prometheus metrics endpoint
    config :pleroma, :instance,
      export_prometheus_metrics: true
    {{- end }}

    # Disable tzdata autoupdate (read-only root filesystem)
    config :tzdata, :autoupdate, :disabled

    # Logging configuration
    config :logger, :console,
      format: "$time $metadata[$level] $message\n",
      metadata: [:request_id]
