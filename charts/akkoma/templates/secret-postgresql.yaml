{{- if not .Values.postgresql.external.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akkoma.fullname" . }}-postgresql
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
data:
  # HARDCODED for Iteration 1 - will use Helm lookup in Iteration 3
  # WARNING: This is a demo value only, NOT for production use
  postgres-password: {{ "changeme-postgres-password-iteration1" | b64enc | quote }}
{{- end }}
