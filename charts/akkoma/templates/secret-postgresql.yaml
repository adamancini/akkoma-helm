{{- if and (not .Values.postgresql.external.enabled) (not .Values.postgresql.cnpg.enabled) }}
{{- $existingPg := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" (include "akkoma.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akkoma.fullname" . }}-postgresql
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
data:
  {{- if $existingPg }}
  # Preserve existing password on upgrade
  postgres-password: {{ index $existingPg.data "postgres-password" }}
  {{- else }}
  # Generate random password on first install (32 characters)
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
