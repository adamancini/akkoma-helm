{{- if and (not .Values.postgresql.external.enabled) (not .Values.postgresql.cnpg.enabled) (not .Values.postgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akkoma.fullname" . }}-postgresql
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
data:
  # Precedence: postgresql.password > existing in-cluster value > random.
  # Set postgresql.password (or postgresql.existingSecret) for GitOps/ArgoCD,
  # where the in-cluster lookup is unavailable and a random value would be
  # regenerated on every render.
  postgres-password: {{ include "akkoma.resolveSecret" (dict "ctx" . "value" .Values.postgresql.password "secretName" (printf "%s-postgresql" (include "akkoma.fullname" .)) "key" "postgres-password" "length" 32) | quote }}
{{- end }}
