apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akkoma.fullname" . }}
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
spec:
  replicas: 1  # Single instance only
  strategy:
    type: Recreate  # Terminate old pod before starting new (single-instance pattern)
  selector:
    matchLabels:
      {{- include "akkoma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force pod restart on config/secret changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap-akkoma.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-akkoma.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/akkoma/metrics"
        prometheus.io/port: "4000"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "akkoma.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Security context: non-root, UID 1000, seccomp RuntimeDefault
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      # Wait for PostgreSQL to be ready before starting Akkoma
      - name: wait-for-db
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h {{ include "akkoma.postgresql.host" . }} -p 5432 -U {{ .Values.postgresql.username }}; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "PostgreSQL is ready!"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.external.enabled }}{{ .Values.postgresql.external.passwordKey | default "password" }}{{ else }}postgres-password{{ end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 999  # postgres user
      # Run database migrations before starting Akkoma
      - name: db-migrate
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - sh
        - -c
        - |
          echo "Running database migrations..."
          /opt/akkoma/bin/pleroma_ctl migrate
          echo "Migrations complete!"
        env:
        # Configuration file path
        - name: PLEROMA_CONFIG_PATH
          value: /etc/akkoma/prod.secret.exs
        # BEAM VM writable paths for read-only root filesystem
        - name: RELEASE_TMP
          value: /tmp/akkoma-release
        - name: ERL_CRASH_DUMP
          value: /tmp/erl_crash.dump
        # Application secrets (from generated or external secret)
        - name: RELEASE_COOKIE
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.secretName" . }}
              key: {{ .Values.externalSecret.keys.releaseCookie | default "release-cookie" }}
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.secretName" . }}
              key: {{ .Values.externalSecret.keys.secretKeyBase | default "secret-key-base" }}
        - name: SIGNING_SALT
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.secretName" . }}
              key: {{ .Values.externalSecret.keys.signingSalt | default "signing-salt" }}
        # Database connection details
        - name: DB_HOST
          value: {{ include "akkoma.postgresql.host" . }}
        - name: DB_NAME
          value: {{ .Values.postgresql.database }}
        - name: DB_USER
          value: {{ .Values.postgresql.username }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.external.enabled }}{{ .Values.postgresql.external.passwordKey | default "password" }}{{ else }}postgres-password{{ end }}
        {{- if or (eq .Values.storage.type "s3") .Values.garage.enabled }}
        # S3 storage credentials
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.s3SecretName" . }}
              key: access-key-id
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.s3SecretName" . }}
              key: secret-access-key
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/akkoma
          readOnly: true
        - name: tmp
          mountPath: /tmp
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      # Download and install frontends if not already present
      - name: install-frontends
        image: alpine:3.23
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          PLEROMA_FE_REF="{{ .Values.frontends.pleromaFe.ref }}"
          ADMIN_FE_REF="{{ .Values.frontends.adminFe.ref }}"
          if [ -d "/frontends/pleroma-fe/${PLEROMA_FE_REF}" ] && [ -d "/frontends/admin-fe/${ADMIN_FE_REF}" ]; then
            echo "Frontends already installed, skipping"
            exit 0
          fi
          {{- if .Values.frontends.pleromaFe.url }}
          PLEROMA_FE_URL="{{ .Values.frontends.pleromaFe.url }}"
          {{- else }}
          PLEROMA_FE_URL="https://akkoma-updates.s3-website.fr-par.scw.cloud/frontend/${PLEROMA_FE_REF}/akkoma-fe.zip"
          {{- end }}
          {{- if .Values.frontends.adminFe.url }}
          ADMIN_FE_URL="{{ .Values.frontends.adminFe.url }}"
          {{- else }}
          ADMIN_FE_URL="https://akkoma-updates.s3-website.fr-par.scw.cloud/frontend/${ADMIN_FE_REF}/admin-fe.zip"
          {{- end }}
          echo "Downloading pleroma-fe (akkoma-fe) ref=${PLEROMA_FE_REF}..."
          wget -q "${PLEROMA_FE_URL}" -O /tmp/akkoma-fe.zip
          mkdir -p /tmp/akkoma-fe
          unzip -q -o /tmp/akkoma-fe.zip -d /tmp/akkoma-fe
          mkdir -p "/frontends/pleroma-fe/${PLEROMA_FE_REF}"
          mv /tmp/akkoma-fe/dist/* "/frontends/pleroma-fe/${PLEROMA_FE_REF}/" 2>/dev/null || mv /tmp/akkoma-fe/* "/frontends/pleroma-fe/${PLEROMA_FE_REF}/"
          rm -rf /tmp/akkoma-fe /tmp/akkoma-fe.zip
          echo "Downloading admin-fe ref=${ADMIN_FE_REF}..."
          wget -q "${ADMIN_FE_URL}" -O /tmp/admin-fe.zip
          mkdir -p /tmp/admin-fe
          unzip -q -o /tmp/admin-fe.zip -d /tmp/admin-fe
          mkdir -p "/frontends/admin-fe/${ADMIN_FE_REF}"
          mv /tmp/admin-fe/dist/* "/frontends/admin-fe/${ADMIN_FE_REF}/" 2>/dev/null || mv /tmp/admin-fe/* "/frontends/admin-fe/${ADMIN_FE_REF}/"
          rm -rf /tmp/admin-fe /tmp/admin-fe.zip
          echo "Frontends installed!"
          ls "/frontends/pleroma-fe/${PLEROMA_FE_REF}/" | head -5
          ls "/frontends/admin-fe/${ADMIN_FE_REF}/" | head -5
        volumeMounts:
        - name: frontends
          mountPath: /frontends
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      containers:
      - name: akkoma
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 4000
          protocol: TCP
        # Startup probe: Allow 150s for initial startup and migrations
        startupProbe:
          httpGet:
            path: /api/v1/instance
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30  # 150s max startup time (30 * 5s)
        # Liveness probe: Restart if unresponsive
        livenessProbe:
          httpGet:
            path: /api/v1/instance
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness probe: Remove from service if not ready
        readinessProbe:
          httpGet:
            path: /api/v1/instance
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        env:
        # Configuration file path
        - name: PLEROMA_CONFIG_PATH
          value: /etc/akkoma/prod.secret.exs
        # BEAM VM writable paths for read-only root filesystem
        - name: RELEASE_TMP
          value: /tmp/akkoma-release
        - name: ERL_CRASH_DUMP
          value: /tmp/erl_crash.dump
        # Application secrets (from generated or external secret)
        - name: RELEASE_COOKIE
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.secretName" . }}
              key: {{ .Values.externalSecret.keys.releaseCookie | default "release-cookie" }}
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.secretName" . }}
              key: {{ .Values.externalSecret.keys.secretKeyBase | default "secret-key-base" }}
        - name: SIGNING_SALT
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.secretName" . }}
              key: {{ .Values.externalSecret.keys.signingSalt | default "signing-salt" }}
        # Database connection details
        - name: DB_HOST
          value: {{ include "akkoma.postgresql.host" . }}
        - name: DB_NAME
          value: {{ .Values.postgresql.database }}
        - name: DB_USER
          value: {{ .Values.postgresql.username }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.external.enabled }}{{ .Values.postgresql.external.passwordKey | default "password" }}{{ else }}postgres-password{{ end }}
        {{- if or (eq .Values.storage.type "s3") .Values.garage.enabled }}
        # S3 storage credentials
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.s3SecretName" . }}
              key: access-key-id
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.s3SecretName" . }}
              key: secret-access-key
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/akkoma
          readOnly: true
        - name: uploads
          mountPath: /opt/akkoma/uploads
        - name: frontends
          mountPath: /opt/akkoma/instance/static/frontends
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: {{ include "akkoma.fullname" . }}-config
          defaultMode: 0640  # Remove world-readable permissions
      - name: uploads
        persistentVolumeClaim:
          claimName: {{ include "akkoma.fullname" . }}-uploads
      - name: frontends
        persistentVolumeClaim:
          claimName: {{ include "akkoma.fullname" . }}-frontends
      # tmpfs volumes for read-only root filesystem
      # BEAM VM requires writable /tmp for System.tmp_dir and release runtime
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
