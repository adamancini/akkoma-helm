apiVersion: v1
kind: Service
metadata:
  name: {{ include "akkoma.fullname" . }}
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "akkoma.selectorLabels" . | nindent 4 }}
