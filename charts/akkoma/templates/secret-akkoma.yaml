{{- if not .Values.externalSecret.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "akkoma.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akkoma.fullname" . }}-secrets
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  # Preserve existing secrets on upgrade
  secret-key-base: {{ index $existing.data "secret-key-base" }}
  signing-salt: {{ index $existing.data "signing-salt" }}
  release-cookie: {{ index $existing.data "release-cookie" }}
  {{- else }}
  # Generate random secrets on first install
  # secret-key-base: 64 character random string for Phoenix sessions
  secret-key-base: {{ randAlphaNum 64 | b64enc | quote }}
  # signing-salt: 8 character random salt for signed tokens
  signing-salt: {{ randAlphaNum 8 | b64enc | quote }}
  # release-cookie: 64 character random string for Erlang distribution
  release-cookie: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
