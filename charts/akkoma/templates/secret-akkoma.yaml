{{- if not .Values.externalSecret.enabled }}
{{- $secretName := printf "%s-secrets" (include "akkoma.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akkoma.fullname" . }}-secrets
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
type: Opaque
data:
  # Precedence for each value: explicit secrets.* value > existing in-cluster value > random.
  # Set secrets.* (or externalSecret.enabled) for GitOps/ArgoCD, where the in-cluster
  # lookup is unavailable and random values would be regenerated on every render,
  # invalidating user sessions.
  # secret-key-base: 64 character string for Phoenix sessions
  secret-key-base: {{ include "akkoma.resolveSecret" (dict "ctx" . "value" .Values.secrets.secretKeyBase "secretName" $secretName "key" "secret-key-base" "length" 64) | quote }}
  # signing-salt: 8 character salt for signed tokens
  signing-salt: {{ include "akkoma.resolveSecret" (dict "ctx" . "value" .Values.secrets.signingSalt "secretName" $secretName "key" "signing-salt" "length" 8) | quote }}
  # release-cookie: 64 character string for Erlang distribution
  release-cookie: {{ include "akkoma.resolveSecret" (dict "ctx" . "value" .Values.secrets.releaseCookie "secretName" $secretName "key" "release-cookie" "length" 64) | quote }}
{{- end }}
