{{- if not .Values.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akkoma.fullname" . }}-secrets
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
type: Opaque
data:
  # HARDCODED for Iteration 1 - will use Helm lookup in Iteration 3
  # WARNING: These are demo values only, NOT for production use
  secret-key-base: {{ "changeme-secret-key-base-iteration1" | b64enc | quote }}
  signing-salt: {{ "changeme-salt" | b64enc | quote }}
  release-cookie: {{ "changeme-release-cookie-iteration1" | b64enc | quote }}
{{- end }}
