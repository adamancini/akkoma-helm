{{- if and (not .Values.postgresql.external.enabled) (not .Values.postgresql.cnpg.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "akkoma.fullname" . }}-postgresql
  labels:
    {{- include "akkoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "akkoma.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "akkoma.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "akkoma.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      {{- with .Values.postgresql.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: postgresql
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.username }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "akkoma.postgresql.secretName" . }}
              key: {{ include "akkoma.postgresql.passwordKey" . }}
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.database }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        {{- with .Values.postgresql.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: run-postgresql
          mountPath: /var/run/postgresql
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.username }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.username }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      {{- if not .Values.postgresql.persistence.enabled }}
      - name: data
        emptyDir: {}
      {{- end }}
      - name: init-scripts
        configMap:
          name: {{ include "akkoma.fullname" . }}-postgresql-init
      # Writable paths for read-only root filesystem
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: run-postgresql
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.postgresql.storageClass }}
      storageClassName: {{ .Values.postgresql.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.storageSize }}
  {{- end }}
{{- end }}
