{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage.fullname" . }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
type: Opaque
data:
  # Precedence per value: explicit value > existing in-cluster value > random.
  admin-token: {{ include "garage.resolveSecret" (dict "ctx" . "value" .Values.adminToken "key" "admin-token" "length" 32) | quote }}
  rpc-secret: {{ include "garage.resolveSecret" (dict "ctx" . "value" .Values.rpcSecret "key" "rpc-secret" "length" 64) | quote }}
{{- end }}
