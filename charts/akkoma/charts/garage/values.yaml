# Garage S3-compatible storage - vendored subchart
# Minimal single-node configuration for Akkoma media storage

image:
  repository: dxflrs/garage
  tag: "v2.3.0"
  pullPolicy: IfNotPresent

# Storage configuration
persistence:
  meta:
    size: 1Gi
    storageClass: ""
  data:
    size: 50Gi
    storageClass: ""

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Garage secrets (admin API token and RPC secret).
# Precedence per value: explicit value below > existing in-cluster value > random.
# For GitOps/ArgoCD set these explicitly (manage with SOPS/Sealed Secrets) or
# reference an existing Secret; otherwise the random fallback is regenerated on
# every `helm template` render.
adminToken: ""
rpcSecret: ""
# Reference an existing Secret instead of generating one. When set, the chart
# renders no garage Secret. The Secret must contain keys: admin-token, rpc-secret.
existingSecret: ""
