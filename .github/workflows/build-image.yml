name: Build and Push Container Image

# Builds one image per commit, tagged <branch-slug>-<ts>-<sha8> (main-<ts>-<sha8>
# on main; see .github/scripts/build-ids.sh), plus a moving <branch-slug> tag
# and `latest` on main. On main it also
# publishes a dev-lane chart (0.0.0-main.<ts>.g<sha8>) that pins that exact
# image -- Kargo's dev Stage tracks these. Release versions (chart X.Y.Z, image
# vX.Y.Z) are only ever minted by release.yml.
#
# Image and chart share one trigger so every main commit that produces a
# chart also produces its image; Kargo's freightCreationCriteria relies on
# the two always coming in matched pairs.
#
# Images are content-addressed: the build inputs (Dockerfile + Akkoma
# version) are hashed, and main publishes the result as inputs-<hash>. When
# that tag already exists the image is re-tagged instead of rebuilt, so
# chart-only commits keep the same digest. That is what lets release.yml keep
# the <appVersion> tag write-once: re-releasing the same Akkoma version with
# an unchanged image is a no-op. Base image updates only take effect through
# a Dockerfile change (pin FROM by digest to make them explicit).

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'charts/**'
      - '.github/workflows/build-image.yml'
      - '.github/scripts/**'
      - 'ct.yaml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'charts/**'
      - '.github/workflows/build-image.yml'
      - '.github/scripts/**'
      - 'ct.yaml'

concurrency:
  # PRs: one group per branch, superseded pushes cancelled. main: one group
  # per commit -- GitHub keeps only one *pending* run per group and cancels
  # the rest, and every main commit needs its artifacts.
  group: build-image-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/akkoma
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      image-tag: ${{ steps.tags.outputs.primary }}
      pushed: ${{ steps.tags.outputs.push }}
      akkoma-version: ${{ steps.akkoma.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PR head, not the synthetic merge commit, so the sha in the tag is
          # one that exists on the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read pinned Akkoma version from Chart.yaml
        id: akkoma
        run: |
          raw=$(grep -m1 '^appVersion:' charts/akkoma/Chart.yaml | sed -E 's/^appVersion:[[:space:]]*//; s/[[:space:]]*$//')
          version=$(printf '%s' "$raw" | sed -E "s/^[\"']//; s/[\"']\$//")
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: appVersion '$version' in charts/akkoma/Chart.yaml is not a valid vX.Y.Z Akkoma release version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        env:
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          AKKOMA_VERSION: ${{ steps.akkoma.outputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # DNS-label style ([a-z0-9-], <=50 chars), close to Argo CD's
            # PR generator branch_slug, so preview tooling can derive it too.
            slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-50 | sed -E 's/-+$//')
            # Never let a branch name produce a tag that means something
            # else: main-*/main/latest (dev lane), a bare number, or
            # inputs-<hash> (content address).
            if [[ "$slug" =~ ^(main|latest|[0-9]+|inputs(-.*)?)$ ]]; then
              slug="branch-${slug}"
            fi
          else
            slug=main
          fi
          if [[ -z "$slug" ]]; then
            echo "ERROR: could not derive an image tag from branch '$HEAD_REF'" >&2
            exit 1
          fi
          # Everything that determines the image's contents. The Dockerfile
          # copies nothing from the build context today; if it ever does, add
          # those paths here or images will be wrongly reused.
          inputs=$({ cat Dockerfile; printf 'AKKOMA_VERSION=%s\n' "$AKKOMA_VERSION"; } | sha256sum | cut -c1-16)
          primary=$(.github/scripts/build-ids.sh HEAD "$slug" | sed -n 's/^image-tag=//p')
          [[ -n "$primary" ]]
          {
            echo "primary=${primary}"
            echo "slug=${slug}"
            echo "inputs=inputs-${inputs}"
            # Fork PRs get no write token; build them without pushing.
            echo "push=${SAME_REPO}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for an existing build of these inputs
        id: reuse
        if: steps.tags.outputs.push == 'true'
        env:
          INPUTS_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.inputs }}
        run: |
          source .github/scripts/registry-lib.sh
          digest=$(image_digest "$INPUTS_REF") && rc=0 || rc=$?
          case $rc in
            0) echo "Reusing ${INPUTS_REF} (${digest})"; echo "hit=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "No build of these inputs yet"; echo "hit=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Extract metadata
        id: meta
        if: steps.reuse.outputs.hit != 'true'
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build
        id: build
        if: steps.reuse.outputs.hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pushed untagged (by digest); tags are applied in the next step,
          # once we know whether another run already published these inputs.
          outputs: ${{ steps.tags.outputs.push == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AKKOMA_VERSION=${{ steps.akkoma.outputs.version }}

      - name: Tag image
        if: steps.tags.outputs.push == 'true'
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          INPUTS_TAG: ${{ steps.tags.outputs.inputs }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          SLUG: ${{ steps.tags.outputs.slug }}
          REUSED: ${{ steps.reuse.outputs.hit }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          source .github/scripts/registry-lib.sh
          tags=("${REPO}:${PRIMARY}" "${REPO}:${SLUG}")
          if [[ "$REUSED" == "true" ]]; then
            src="${REPO}:${INPUTS_TAG}"
          else
            src="${REPO}@${BUILT_DIGEST}"
            # Only main publishes the content address, and only if no other
            # run beat us to it -- first build of given inputs wins.
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              existing=$(image_digest "${REPO}:${INPUTS_TAG}") && rc=0 || rc=$?
              case $rc in
                0) echo "Another run published ${INPUTS_TAG} meanwhile; using it"; src="${REPO}@${existing}" ;;
                1) tags+=("${REPO}:${INPUTS_TAG}") ;;
                *) exit 1 ;;
              esac
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tags+=("${REPO}:latest")
          fi
          args=()
          for t in "${tags[@]}"; do args+=(--tag "$t"); done
          docker buildx imagetools create "${args[@]}" "$src"
          echo "Tagged ${tags[*]} -> ${src}"

      - name: Run Trivy vulnerability scanner
        if: steps.tags.outputs.push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.tags.outputs.push == 'true'
        with:
          sarif_file: 'trivy-image-results.sarif'

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v7
        if: steps.tags.outputs.push == 'true'
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
          fail-build: false
          severity-cutoff: critical

  chart-install:
    name: Chart Testing (install)
    needs: build
    # Installs the image this PR built, not the appVersion tag: that tag only
    # exists once a release creates it, so a PR bumping appVersion would
    # otherwise fail to pull. Runs for every PR this workflow triggers on, so
    # Dockerfile-only changes get an install test too. On main, Kargo's dev
    # Stage is the install test.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0

      # Fork PRs can't push, so their image only exists locally: rebuild it
      # (amd64, mostly from the build job's cache) and load it into kind.
      - name: Set up Docker Buildx
        if: needs.build.outputs.pushed != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image locally
        if: needs.build.outputs.pushed != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ct-local/akkoma:${{ needs.build.outputs.image-tag }}
          cache-from: type=gha
          build-args: |
            AKKOMA_VERSION=${{ needs.build.outputs.akkoma-version }}

      - name: Load image into kind
        if: needs.build.outputs.pushed != 'true'
        env:
          IMAGE: ct-local/akkoma:${{ needs.build.outputs.image-tag }}
        run: kind load docker-image "$IMAGE" --name chart-testing

      - name: Select image under test
        id: image
        env:
          PUSHED: ${{ needs.build.outputs.pushed }}
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          if [[ "$PUSHED" == "true" ]]; then
            echo "repository=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "repository=ct-local/akkoma" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install CloudNativePG operator
        run: |
          kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.0/cnpg-1.30.0.yaml
          kubectl rollout status deployment -n cnpg-system cnpg-controller-manager --timeout=120s

      - name: Install Prometheus Operator ServiceMonitor CRD
        run: |
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.93.0/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Deploy standalone PostgreSQL for external-db test
        run: |
          kubectl create namespace ct-akkoma
          kubectl create secret generic pg-password --from-literal=password=ct-test-password -n ct-akkoma
          kubectl create secret generic my-akkoma-secrets -n ct-akkoma \
            --from-literal=secret-key-base=ct-test-secret-key-base-0123456789abcdefghijklmnopqrstuvwxyz0123456789ab \
            --from-literal=signing-salt=ctsalt01 \
            --from-literal=release-cookie=ct-test-release-cookie-0123456789abcdefghijklmnopqrstuvwxyz0123456789ab
          kubectl run postgres-external --image=postgres:15-alpine -n ct-akkoma \
            --env=POSTGRES_USER=akkoma --env=POSTGRES_PASSWORD=ct-test-password --env=POSTGRES_DB=akkoma \
            --port=5432 --labels=app=postgres-external
          kubectl expose pod postgres-external --name=postgres -n ct-akkoma --port=5432
          kubectl wait --for=condition=ready pod/postgres-external -n ct-akkoma --timeout=120s
          for _ in $(seq 1 30); do
            kubectl exec -n ct-akkoma postgres-external -- pg_isready -U akkoma && break
            sleep 2
          done
          kubectl exec -n ct-akkoma postgres-external -- psql -U akkoma -d akkoma -c \
            'CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run chart-testing (install)
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          # --charts, not --target-branch: install even when only the
          # Dockerfile changed. ct runs once per charts/akkoma/ci/*-values.yaml.
          ct install --config ct.yaml \
            --charts charts/akkoma \
            --namespace ct-akkoma \
            --helm-extra-set-args "--set=akkoma.domain=test.example.com --set=akkoma.adminEmail=admin@test.example.com --set=postgresql.external.host=postgres.ct-akkoma.svc.cluster.local --set=image.repository=${IMAGE_REPOSITORY} --set=image.tag=${IMAGE_TAG}"

  publish-dev-chart:
    name: Publish Dev Chart
    needs: build
    # Pushed after the image so Kargo never sees a chart whose image is missing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push dev chart
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          version=$(.github/scripts/build-ids.sh HEAD | sed -n 's/^chart-version=//p')
          work=$(mktemp -d)
          cp -r charts/akkoma "$work/akkoma"
          .github/scripts/set-chart-identity.sh "$work/akkoma" "$version" "$IMAGE_TAG"
          helm package "$work/akkoma" --destination "$work/out"
          helm push "$work/out/akkoma-${version}.tgz" "$CHART_REPO"
          {
            echo "### Dev chart published"
            echo ""
            echo "- Chart: \`${CHART_REPO}/akkoma:${version}\`"
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
