name: Release Helm Chart

# Cuts chart release X.Y.Z from a commit on main that already has a dev-lane
# chart (published by build-image.yml). Normally dispatched by Kargo's
# `release` Stage (gha-dispatch-workflow); run it by hand as the escape hatch:
#
#   gh workflow run release.yml -f sha=<commit> -f version=0.6.3
#
# Kargo decides *whether* and *what* to release; this workflow only enforces
# packaging invariants, so they hold no matter who dispatched it:
#   - version is X.Y.Z, newer than every existing chart-v* tag, not yet published
#   - the image is re-tagged main-<ts>-<sha8> -> <appVersion>, never rebuilt, and an
#     existing <appVersion> tag is never moved unless overwrite-image-tag is set
#   - the release chart is the dev chart with only `version` and `image.tag`
#     changed (verified by reversing the edit and diffing)
# Order matters: image, then OCI chart, then git tag -- Kargo's release
# Warehouse must never see a chart whose image doesn't exist yet.
#
# Safe to re-run with the same inputs after a partial failure: each publish
# step skips work this release already did and fails on anything else.
# Releases are serialized; GitHub cancels all but one *queued* run per
# concurrency group, so a second release dispatched while one is waiting
# shows up as cancelled (in Kargo, as a failed promotion) -- promote again.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to release (8-40 hex chars); must have a published dev chart'
        required: true
        type: string
      version:
        description: 'Chart version to release, X.Y.Z (a leading v is stripped)'
        required: true
        type: string
      overwrite-image-tag:
        description: 'Move an existing <appVersion> image tag to this build (it is otherwise write-once)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-chart
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/akkoma
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        id: inputs
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$*"; exit 1; }

          version="${INPUT_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version '$INPUT_VERSION' is not X.Y.Z"
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{8,40}$ ]] || fail "sha '$INPUT_SHA' is not 8-40 lowercase hex chars"

          sha=$(git rev-parse --verify --quiet "${INPUT_SHA}^{commit}") || fail "commit $INPUT_SHA not found"
          git merge-base --is-ancestor "$sha" origin/main || fail "commit $sha is not on main"

          # Re-running a release that failed partway is allowed: an existing
          # tag is fine if it already marks this commit (later steps then skip
          # whatever was already published). Any other existing tag is a
          # conflict.
          tag="chart-v${version}"
          resuming=false
          if tagged=$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}"); then
            [[ "$tagged" == "$sha" ]] || fail "tag ${tag} already exists on ${tagged}, not ${sha}"
            resuming=true
            echo "::notice::${tag} already marks ${sha}; resuming a partial release"
          fi
          if [[ "$resuming" != "true" ]]; then
            latest=$(git tag -l 'chart-v*' | sed 's/^chart-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]]; then
              fail "version ${version} is not newer than the latest release ${latest}"
            fi
          fi

          {
            echo "version=${version}"
            echo "sha=${sha}"
            echo "tag=${tag}"
            .github/scripts/build-ids.sh "$sha" | sed -e 's/^image-tag=/dev-image-tag=/' -e 's/^chart-version=/dev-version=/'
          } >> "$GITHUB_OUTPUT"

      - name: Pull dev chart
        id: dev
        env:
          DEV_VERSION: ${{ steps.inputs.outputs.dev-version }}
          DEV_IMAGE_TAG: ${{ steps.inputs.outputs.dev-image-tag }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          helm pull "${CHART_REPO}/akkoma" --version "$DEV_VERSION" --untar --untardir dev \
            || fail "dev chart ${DEV_VERSION} not found -- was this commit built on main by build-image.yml?"
          pinned=$(yq '.image.tag' dev/akkoma/values.yaml)
          [[ "$pinned" == "$DEV_IMAGE_TAG" ]] || fail "dev chart pins image '${pinned}', expected '${DEV_IMAGE_TAG}'"
          app_version=$(yq '.appVersion' dev/akkoma/Chart.yaml)
          [[ "$app_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "dev chart appVersion '${app_version}' is not vX.Y.Z"
          echo "app-version=${app_version}" >> "$GITHUB_OUTPUT"

      - name: Re-tag image
        env:
          SRC: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.inputs.outputs.dev-image-tag }}
          DST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.dev.outputs.app-version }}
          OVERWRITE: ${{ inputs.overwrite-image-tag }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          source .github/scripts/registry-lib.sh

          src_digest=$(image_digest "$SRC") && rc=0 || rc=$?
          case $rc in
            0) ;;
            1) fail "image ${SRC} not found" ;;
            *) exit 1 ;;
          esac
          dst_digest=$(image_digest "$DST") && rc=0 || rc=$?
          case $rc in
            0)
              if [[ "$dst_digest" == "$src_digest" ]]; then
                echo "${DST} already points at ${src_digest}; nothing to do"
                exit 0
              fi
              # build-image.yml reuses images by content, so a different
              # digest means the image itself changed (Dockerfile edit)
              # under the same Akkoma version -- and moving the tag would
              # change what already-released charts pinning it run.
              [[ "$OVERWRITE" == "true" ]] || fail "${DST} already exists at ${dst_digest}, not ${src_digest} (${SRC}): the image changed without an Akkoma version bump. Release tags are write-once; bump appVersion, or re-run with overwrite-image-tag=true to move it deliberately (this also changes what earlier releases pinning ${DST} pull)."
              echo "::warning::moving ${DST} from ${dst_digest} to ${src_digest}"
              ;;
            1) ;;
            *) exit 1 ;;
          esac
          docker buildx imagetools create --tag "$DST" "$SRC"

      - name: Build release chart
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          DEV_VERSION: ${{ steps.inputs.outputs.dev-version }}
          DEV_IMAGE_TAG: ${{ steps.inputs.outputs.dev-image-tag }}
        run: |
          cp -r dev/akkoma release-src
          # Empty image.tag -> defaults to appVersion, i.e. the tag just created.
          .github/scripts/set-chart-identity.sh release-src "$VERSION" ""
          helm package release-src --destination .deploy

          # Prove nothing but version and image.tag changed: undo both edits on
          # the packaged result and it must be identical to the dev chart.
          mkdir check
          tar -xzf ".deploy/akkoma-${VERSION}.tgz" -C check
          .github/scripts/set-chart-identity.sh check/akkoma "$DEV_VERSION" "$DEV_IMAGE_TAG"
          diff -r dev/akkoma check/akkoma

      - name: Push chart to OCI registry
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          DEV_VERSION: ${{ steps.inputs.outputs.dev-version }}
          DEV_IMAGE_TAG: ${{ steps.inputs.outputs.dev-image-tag }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          source .github/scripts/registry-lib.sh
          chart_present "${CHART_REPO}/akkoma" "$VERSION" && rc=0 || rc=$?
          case $rc in
            1) helm push ".deploy/akkoma-${VERSION}.tgz" "$CHART_REPO" ;;
            0)
              # Already published: fine only if it is this release (a re-run
              # after a later step failed), i.e. the same dev chart underneath.
              helm pull "${CHART_REPO}/akkoma" --version "$VERSION" --untar --untardir published
              .github/scripts/set-chart-identity.sh published/akkoma "$DEV_VERSION" "$DEV_IMAGE_TAG"
              diff -r dev/akkoma published/akkoma >/dev/null \
                || fail "chart ${VERSION} is already published and was not built from ${DEV_VERSION}"
              echo "::notice::chart ${VERSION} already published from ${DEV_VERSION}; skipping push"
              ;;
            *) exit 1 ;;
          esac

      - name: Tag release commit
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          SHA: ${{ steps.inputs.outputs.sha }}
          VERSION: ${{ steps.inputs.outputs.version }}
          APP_VERSION: ${{ steps.dev.outputs.app-version }}
        run: |
          # Validation already guaranteed an existing tag marks this commit.
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists; skipping"
            exit 0
          fi
          git tag -a "$TAG" "$SHA" -m "Chart ${VERSION} (Akkoma ${APP_VERSION})"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.inputs.outputs.tag }}
          name: v${{ steps.inputs.outputs.version }}
          files: .deploy/*.tgz
          generate_release_notes: true

      - name: Publish to GitHub Pages (Chart Repository)
        run: |
          git clone --single-branch --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
          cp .deploy/*.tgz gh-pages/
          cd gh-pages
          helm repo index . --url https://${{ github.repository_owner }}.github.io/akkoma-helm
          git add .
          git commit -m "Release ${{ steps.inputs.outputs.tag }}"
          git push origin gh-pages

      - name: Summary
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          SHA: ${{ steps.inputs.outputs.sha }}
          APP_VERSION: ${{ steps.dev.outputs.app-version }}
          DEV_VERSION: ${{ steps.inputs.outputs.dev-version }}
        run: |
          {
            echo "### Released chart ${VERSION}"
            echo ""
            echo "- Commit: \`${SHA}\`"
            echo "- Chart: \`${CHART_REPO}/akkoma:${VERSION}\` (repackaged from \`${DEV_VERSION}\`)"
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
