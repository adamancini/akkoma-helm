name: Lint and Test

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'Dockerfile'
      - '.github/workflows/lint-test.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'Dockerfile'
      - '.github/workflows/lint-test.yml'

jobs:
  lint-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Helm Lint
        run: |
          helm lint charts/akkoma --strict

      - name: Helm Template (default values)
        run: |
          helm template akkoma charts/akkoma \
            --set akkoma.domain=test.example.com \
            --set akkoma.adminEmail=admin@test.example.com \
            --debug

      - name: Helm Template (all CI value files)
        run: |
          for f in charts/akkoma/ci/*.yaml; do
            echo "=== Testing with ${f} ==="
            helm template akkoma charts/akkoma -f "${f}" --debug > /dev/null
            echo "  OK"
          done

  lint-yaml:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: |
          yamllint -c .yamllint.yml charts/akkoma/values.yaml charts/akkoma/Chart.yaml charts/akkoma/ci/

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s-version:
          - "1.28.0"
          - "1.29.0"
          - "1.30.0"
          - "1.31.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Manifests (K8s ${{ matrix.k8s-version }})
        run: |
          for f in charts/akkoma/ci/*.yaml; do
            echo "=== Validating with ${f} against K8s ${{ matrix.k8s-version }} ==="
            helm template akkoma charts/akkoma -f "${f}" \
              | kubeconform -strict -summary \
                -kubernetes-version ${{ matrix.k8s-version }} \
                -ignore-missing-schemas
          done

  security-scan-chart:
    name: Security Scan Helm Chart
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy for Helm Chart
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'charts/'
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivy-config: 'trivy.yaml'
          trivyignores: '.trivyignore'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  chart-testing:
    name: Chart Testing (ct)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0

      - name: Install CloudNativePG operator
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.0/cnpg-1.30.0.yaml
          kubectl rollout status deployment -n cnpg-system cnpg-controller-manager --timeout=120s

      - name: Install Prometheus Operator ServiceMonitor CRD
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.93.0/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Deploy standalone PostgreSQL for external-db test
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl create namespace ct-akkoma
          kubectl create secret generic pg-password --from-literal=password=ct-test-password -n ct-akkoma
          kubectl create secret generic my-akkoma-secrets -n ct-akkoma \
            --from-literal=secret-key-base=ct-test-secret-key-base-0123456789abcdefghijklmnopqrstuvwxyz0123456789ab \
            --from-literal=signing-salt=ctsalt01 \
            --from-literal=release-cookie=ct-test-release-cookie-0123456789abcdefghijklmnopqrstuvwxyz0123456789ab
          kubectl run postgres-external --image=postgres:15-alpine -n ct-akkoma \
            --env=POSTGRES_USER=akkoma --env=POSTGRES_PASSWORD=ct-test-password --env=POSTGRES_DB=akkoma \
            --port=5432 --labels=app=postgres-external
          kubectl expose pod postgres-external --name=postgres -n ct-akkoma --port=5432
          kubectl wait --for=condition=ready pod/postgres-external -n ct-akkoma --timeout=120s
          for i in $(seq 1 30); do
            kubectl exec -n ct-akkoma postgres-external -- pg_isready -U akkoma && break
            sleep 2
          done
          kubectl exec -n ct-akkoma postgres-external -- psql -U akkoma -d akkoma -c \
            'CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --namespace ct-akkoma \
            --helm-extra-set-args '--set=akkoma.domain=test.example.com --set=akkoma.adminEmail=admin@test.example.com --set=postgresql.external.host=postgres.ct-akkoma.svc.cluster.local'
