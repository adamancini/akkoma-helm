version: 2

updates:
  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "adamancini"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker base images in Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "adamancini"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Only patch and minor updates for base images
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Helm chart dependencies (if any are added)
  # Note: Currently no subchart dependencies, but this will be needed if we add any
  # - package-ecosystem: "docker"
  #   directory: "/charts/akkoma"
  #   schedule:
  #     interval: "monthly"
  #   labels:
  #     - "dependencies"
  #     - "helm"
  #   reviewers:
  #     - "adamancini"
  #   commit-message:
  #     prefix: "chore(deps)"
  #     include: "scope"

