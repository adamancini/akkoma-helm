apiVersion: v1
kind: Pod
metadata:
  name: akkoma-test
  labels:
    app: akkoma
    test: validation
spec:
  containers:
  - name: akkoma
    image: ghcr.io/adamancini/akkoma:v3.17.0
    command: ["sleep", "3600"]
    env:
    - name: SECRET_KEY_BASE
      value: "test-secret-key-base-for-validation-only"
    - name: SIGNING_SALT
      value: "test-salt"
    - name: RELEASE_COOKIE
      value: "test-cookie"
  imagePullSecrets:
  - name: ghcr-secret
  restartPolicy: Never
